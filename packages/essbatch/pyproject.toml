[build-system]
requires = [
  "setuptools>=77",
  "setuptools_scm[toml]>=8.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "essbatch"
description = "Reduce many runs as batches, from the command line or a web page"
authors = [{ name = "Scipp contributors" }]
license = "BSD-3-Clause"
readme = "README.md"
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.12"

dynamic = ["version"]

dependencies = [
    "essapps[files]",
    "essspec",
    "pydantic>=2.12",
]

[project.optional-dependencies]
web = ["fastapi", "uvicorn"]
scicat = ["essapps[scicat]"]
test = [
    "essbatch[scicat,web]",
    "essspec[scipp,sciline]",
    "httpx",
    "playwright",
    "pytest>=9.0",
    "pytest-xdist>=3.6",
]

[project.scripts]
essbatch = "ess.batch.cli:main"

[project.urls]
"Bug Tracker" = "https://github.com/scipp/essapps/issues"
"Source" = "https://github.com/scipp/essapps/tree/main/packages/essbatch"

[tool.setuptools_scm]
root = "../.."
tag_regex = "^essbatch/(?P<version>.*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "essbatch/*[0-9]*"]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = """
--strict-config
-p no:benchmark
--strict-markers
--import-mode=importlib
-ra
"""
testpaths = "tests"
faulthandler_timeout = 120
xfail_strict = true
filterwarnings = [
  "error",
  # Starlette 1.10's test client asks for httpx2 in place of httpx.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
warn_unreachable = true
