<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batch reduction</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6fb3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="static/vendor/tabulator.min.css">
  <link rel="stylesheet" href="static/style.css">
  <script src="static/vendor/plotly-basic.min.js"></script>
  <script type="module" src="static/app.js"></script>
</head>
<body>
  <header class="top">
    <h1 id="title">Batch reduction</h1>
    <nav class="views" aria-label="View">
      <button type="button" data-view="samples" aria-pressed="true">Samples <span class="n" id="n-samples"></span></button>
      <button type="button" data-view="runs" aria-pressed="false">Runs <span class="n" id="n-runs"></span></button>
    </nav>
    <span class="spacer"></span>
    <span class="folder" id="folder" title="Data folder"></span>
    <div class="menu" id="files">
      <button type="button" class="menu-button" aria-haspopup="true">Files <span class="caret">▾</span></button>
      <div class="menu-items" role="menu" hidden>
        <div class="menu-heading">Sample table</div>
        <button type="button" data-file="load-table">Load table… <small>CSV, XLSX</small></button>
        <button type="button" data-file="table.csv">Save as CSV</button>
        <button type="button" data-file="table.xlsx">Save as XLSX</button>
        <div class="menu-heading">Settings</div>
        <button type="button" data-file="load-settings">Load settings… <small>YAML</small></button>
        <button type="button" data-file="settings.yaml">Save settings</button>
        <div class="menu-heading">Results</div>
        <button type="button" data-file="results-selected">Download selected <small id="n-results-selected"></small></button>
        <button type="button" data-file="results-all">Download all <small id="n-results-all"></small></button>
      </div>
      <input type="file" id="pick-table" accept=".csv,.tsv,.xlsx" hidden>
      <input type="file" id="pick-settings" accept=".yaml,.yml,.json" hidden>
    </div>
  </header>

  <main>
    <section class="left">
      <div class="view" id="view-samples">
        <div class="toolbar">
          <div class="split" id="reduce-split">
            <button type="button" class="primary" id="reduce"><span class="label">Reduce</span><span class="bar"></span></button>
            <button type="button" class="primary more" id="reduce-more" aria-haspopup="true" aria-label="Other ways to reduce">▾</button>
            <div class="menu-items" role="menu" hidden>
              <button type="button" data-reduce="all">Reduce all ready <small id="n-ready"></small></button>
              <button type="button" data-reduce="selected">Reduce selected <small id="n-selected"></small></button>
            </div>
          </div>
          <button type="button" id="cancel">Cancel</button>
          <span class="spacer"></span>
          <button type="button" class="quiet" id="rescan" title="Read the runs again and pair them into samples. What you set by hand stays.">↻ Rescan runs</button>
        </div>
        <div class="chips" id="chips" role="group" aria-label="Show samples that are"></div>
        <div class="message" id="message" hidden>
          <div class="message-text"></div>
          <button type="button" class="quiet close" aria-label="Dismiss">×</button>
        </div>
        <div class="grid" id="rows"></div>
        <div class="table-foot">
          <button type="button" class="quiet" id="add-row">+ Add sample</button>
          <form class="add-form" id="add-form" hidden>
            <input type="text" name="key" placeholder="Name of the new sample" aria-label="Name of the new sample" required>
            <button type="submit">Add</button>
            <button type="button" class="quiet" data-cancel>Cancel</button>
          </form>
          <span class="spacer"></span>
          <span id="selection"></span>
          <button type="button" class="quiet" id="remove" hidden>Remove selected</button>
          <span id="removed" hidden>· <button type="button" class="link" id="restore"></button></span>
        </div>
      </div>

      <div class="view" id="view-runs" hidden>
        <div class="toolbar">
          <p class="hint">Correct what a run was measured for, or which sample it belongs to. The samples are paired again at once. Double-click a cell to edit it.</p>
        </div>
        <div class="grid" id="runs"></div>
      </div>
    </section>

    <aside class="right">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="result" aria-selected="true">Result</button>
        <button type="button" role="tab" data-tab="settings" aria-selected="false">Settings</button>
        <button type="button" role="tab" data-tab="row" aria-selected="false">Sample</button>
      </div>
      <div class="tab" id="tab-result">
        <div class="plot-head"><span id="plot-title"></span></div>
        <div id="plot"></div>
        <div class="empty" id="plot-empty" hidden></div>
        <p class="note" id="plot-note"></p>
        <ul class="not-done" id="not-done"></ul>
      </div>
      <div class="tab" id="tab-settings" hidden>
        <p class="hint">Shared by every sample. A change marks the results reduced with other settings as outdated.</p>
        <div class="form" id="settings"></div>
      </div>
      <div class="tab" id="tab-row" hidden></div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
